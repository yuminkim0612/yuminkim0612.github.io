
# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language and timezone
lang: ko-KR
timezone: Asia/Seoul

# Blog information
title: HSPACE
tagline: Cybersecurity & Learning
description: >-
  사이버보안 학습 기록과 프로젝트 경험을 정리하는 개인 블로그입니다.

# GitHub Pages URL
url: "https://yuminkim0612.github.io"

github:
  username: yuminkim0612

twitter:
  username:

social:
  name: HSPACE
  email:
  fediverse_handle:
  links:
    - https://github.com/yuminkim0612

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# Theme: light or dark
theme_mode: light

# CDN endpoint
cdn:

# Profile image
avatar:

# Social preview image
social_preview_image:

# Table of contents
toc: true

# Post actions
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Static assets
assets:
  self_host:
    enabled:
    env:

# Progressive Web App
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# Base URL
baseurl: ""

# Jekyll configuration
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Sass
sass:
  style: compressed

# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Excluded files
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# Category and tag archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
